<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cardápio</title>
</head>

<body>

    <!-- ===== MENU SUPERIOR ===== -->
    <header class="header">
        <img src="imagens/logo.png" alt="Logo" class="logo">
        <h1 class="titulo">MENU</h1>
    </header>

    <div class="menu-container" id="menu"></div>

    <script>
        // 🔗 URL do backend
        const API_URL = "http://localhost:8080/produto";

        // 🔄 Mapeamento do tipo_prod → categoria exibida
        const categorias = {
            "L": "LANCHES",
            "B": "BEBIDAS",
            "D": "DOCES"
        };

        // Agrupador de categorias
        function agruparPorCategoria(produtos) {
            const grupos = {};

            produtos.forEach(p => {
                const categoria = categorias[p.tipo_prod] || "OUTROS";

                if (!grupos[categoria]) {
                    grupos[categoria] = [];
                }
                grupos[categoria].push(p);
            });

            return grupos;
        }

        // Criar HTML de cada item
        function criarItem(prod) {
            return `
                <div class="item">
                    <h3>${prod.nome_prod}</h3>
                    ${prod.descricao_prod ? `<p>${prod.descricao_prod}</p>` : ""}
                    <span class="price">R$ ${prod.preco_prod.toFixed(2)}</span>
                    <button>+</button>
                </div>
            `;
        }

        // Carregar produtos
        fetch(API_URL)
            .then(r => r.json())
            .then(produtos => {
                const menu = document.getElementById("menu");
                const grupos = agruparPorCategoria(produtos);

                // Criar um bloco por categoria
                Object.keys(grupos).forEach(categoria => {
                    const categoriaBox = document.createElement("div");
                    categoriaBox.classList.add("category-box");

                    categoriaBox.innerHTML = `
                        <h2>${categoria}</h2>
                        ${grupos[categoria].map(criarItem).join("")}
                    `;

                    menu.appendChild(categoriaBox);
                });
            })
            .catch(err => console.error("Erro ao carregar produtos:", err));
    </script>

</body>
</html>
